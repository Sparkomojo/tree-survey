<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route Notes has moved</title>
<meta http-equiv="refresh" content="0; url=https://sparkomojo.github.io/route-notes/">
<link rel="canonical" href="https://sparkomojo.github.io/route-notes/">
<script>
  // the first copy of Route Notes lived here: stop its offline worker, then go to the new address (your notes come with you)
  (async () => {
    try {
      if ("serviceWorker" in navigator) for (const r of await navigator.serviceWorker.getRegistrations())
        if (r.scope.endsWith("/tree-survey/route-notes/")) await r.unregister();
    } catch (e) {}
    location.replace("https://sparkomojo.github.io/route-notes/");
  })();
</script>
</head>
<body style="font-family: system-ui, sans-serif; padding: 24px">
<p>Route Notes has moved to <a href="https://sparkomojo.github.io/route-notes/">sparkomojo.github.io/route-notes</a>.</p>
</body>
</html>
